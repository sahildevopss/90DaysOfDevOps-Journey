services:
  db:
    labels:
      project: "day-32"
      service: "database"

    image: postgres:latest
    container_name: compose-db
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: on-failure

    environment:
      POSTGRES_DB: database
      POSTGRES_USER: devops
      POSTGRES_PASSWORD:  devops

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U devops -d database"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  webapp:
    labels:
      project: "day-34"
      service: "webapp"

    depends_on:
      db:
        condition: service_healthy

    build: .
    container_name: compose-web
    networks:
      - app-network
    ports:
      - "80:80"

  redis:
    labels:
      project: "day-34"
      service: "cache"

    image: redis:alpine
    container_name: compose-redis
    networks:
      - app-network


   
volumes:
  postgres_data: 

networks:
  app-network:
    driver: bridge
